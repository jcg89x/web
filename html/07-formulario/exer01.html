<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/enviar" method="post" autocomplete="on">
        <fieldset>
            <legend>Formulario de contacto</legend>

            <!-- Campo Nombre -->
            <label for="nombre">Nombre:</label>
            <input id="nombre" type="text" name="nombre" placeholder="Escribe tu nombre completo" required>
            <br><br>

            <!-- Campo Email -->
            <label for="email">Email:</label>
            <input id="email" type="email" name="email" placeholder="ejemplo@correo.com" required>
            <br><br>

            <!-- Campo Mensaje -->
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
            <br><br>

            <!-- Botón de envío -->
            <button type="submit">Enviar</button>
            <!-- Botón de reset -->
            <button type="reset">Restablecer</button>
        </fieldset>
    </form>
</body>
</html>
