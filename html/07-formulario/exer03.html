<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/74/Social_media_collection_2020s.png/500px-Social_media_collection_2020s.png" width="300"/>
    <form action="/registro" method="post">
        <fieldset>
            <legend>Registro Mi Red Social</legend>

            <!-- Nombre de usuario -->
            <label for="usuario">Nombre de usuario:</label>
            <input id="usuario" type="text" name="usuario" required>
            <br><br>

            <!-- Email -->
            <label for="email">Correo electrónico:</label>
            <input id="email" type="email" name="email" required>
            <br><br>

            <!-- Contraseña -->
            <label for="password">Contraseña:</label>
            <input id="password" type="password" name="password" required>
            <br><br>

            <!-- Confirmar contraseña -->
            <label for="confirmar">Confirmar contraseña:</label>
            <input id="confirmar" type="password" name="confirmar" required>
            <br><br>

            <!-- Fecha de nacimiento -->
            <label for="fecha">Fecha de nacimiento:</label>
            <input id="fecha" type="date" name="fecha" required>
            <br><br>

            <!-- Género -->
            <label for="genero">Género:</label>
            <select id="genero" name="genero" required>
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
                <option value="otro">Otro</option>
            </select>
            <br><br>

            <!-- Botones -->
            <button type="submit">Registrarse</button>
            <button type="reset">Reset</button>
</body>
</html>
