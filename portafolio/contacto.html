<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacte | Ilyas El Ouahabi</title>
    <link rel="stylesheet" href="../css1/index.css">
</head>
<body>

    <header>
        <h1>Portfoli Digital d'Ilyas</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inici</a></li>
                <li><a href="sobre-mi.html">Sobre mi</a></li>
                <li><a href="../actividades.html">Activitats</a></li>
                <li><a href="contacto.html" class="active">Contacte</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="seccio-formulari">
            <h2>Posa't en contacte amb mi</h2>
            <p>Si tens algun dubte sobre les meves pràctiques de SMX o vols parlar sobre algun projecte de muntatge de PCs, omple aquest formulari:</p>

            <form action="#" method="get" class="formulari-estil">
                
                <div class="grup-input">
                    <label for="nom">Nom i Cognoms:</label>
                    <input type="text" id="nom" name="nom" placeholder="Escriu aquí el teu nom" required>
                </div>

                <div class="grup-input">
                    <label for="email">Correu electrònic:</label>
                    <input type="email" id="email" name="email" placeholder="hola@gmail.es" required>
                </div>

                <div class="grup-input">
                    <label for="motiu">Motiu del missatge:</label>
                    <select id="motiu" name="motiu">
                        <option value="suport">Suport tècnic / Optimització</option>
                        <option value="activitats">Dubte sobre activitats HTML/CSS</option>
                        <option value="altre">Altres motius</option>
                    </select>
                </div>

                <div class="grup-input">
                    <label for="missatge">Missatge:</label>
                    <textarea id="missatge" name="missatge" rows="6" placeholder="Com et puc ajudar?" required></textarea>
                </div>

                <button type="submit" class="boto-enviar">Enviar Missatge</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Ilyas El Ouahabi — Alumne de SMX a La Caparrella</p>
    </header>

</body>
</html>
