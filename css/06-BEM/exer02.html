<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Comentarios</title>
    <link rel="stylesheet" href="exer02.css">
</head>
<body>

    <section class="comentarios">

        <h2 class="comentarios__titulo">Comentarios</h2>

        <div class="comentarios__lista">

            <article class="comentario">
                <div class="comentario__autor">Jose</div>
                <p class="comentario__texto">
                    Este es un comentario de ejemplo.
                </p>
            </article>

            <article class="comentario">
                <div class="comentario__autor">Maria</div>
                <p class="comentario__texto">
                    Me ha gustado mucho el contenido.
                </p>
            </article>

        </div>

        <form class="comentarios__form">
            <input type="text" class="comentarios__input" placeholder="Escribe un comentario...">
            <button class="comentarios__btn">Enviar</button>
        </form>

    </section>

</body>
</html>
