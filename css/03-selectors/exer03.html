El texto del p id="pluton" es rojo.<br/>

Razón:
Aunque tiene dos clases (venus y marte), las dos cambian el color. En el CSS, la clase .marte está escrita después que .venus, y en CSS la última regla que aparece es la que se aplica. Por eso el color final es rojo
